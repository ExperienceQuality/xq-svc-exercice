name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      POSTGRES_PASSWORD: ci-exercise-service-password
      XQORB_BASE_URI: http://localhost:8080

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run checks and package service
        run: ./gradlew --no-daemon ci

      - name: Start PostgreSQL
        run: docker compose up -d --wait

      - name: Start packaged service
        shell: bash
        run: |
          nohup java -jar build/service/exercise-service.jar \
            --spring.profiles.active=e2e \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/exercise_service \
            --spring.datasource.username=exercise_service \
            --spring.datasource.password="$POSTGRES_PASSWORD" \
            > build/application.log 2>&1 &
          echo $! > build/application.pid

      - name: Wait for service health
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/actuator/health > /dev/null; then
              exit 0
            fi
            if [[ -f build/application.pid ]] && ! kill -0 "$(<build/application.pid)" 2>/dev/null; then
              echo 'Packaged service exited before becoming healthy.'
              exit 1
            fi
            sleep 2
          done
          echo 'Timed out waiting for the packaged service.'
          exit 1

      - name: Run end-to-end tests
        run: ./gradlew --no-daemon e2e

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exercise-service-ci-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/application.log
            build/service/exercise-service.jar
            build/reports/**
            build/test-results/**

      - name: Stop service
        if: always()
        run: |
          if [[ -f build/application.pid ]]; then
            kill "$(<build/application.pid)" 2>/dev/null || true
          fi

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down --volumes --remove-orphans
