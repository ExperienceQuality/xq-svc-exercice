name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read

  publish-and-deploy:
    name: Publish image and deploy Render
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build immutable image
        env:
          IMAGE: ghcr.io/experiencequality/xq-svc-exercice
        run: ./gradlew --no-daemon bootBuildImage --imageName="$IMAGE:sha-${GITHUB_SHA}"

      - name: Publish immutable and default tags
        env:
          IMAGE: ghcr.io/experiencequality/xq-svc-exercice
        run: |
          docker push "$IMAGE:sha-${GITHUB_SHA}"
          docker tag "$IMAGE:sha-${GITHUB_SHA}" "$IMAGE:latest"
          docker push "$IMAGE:latest"

      - name: Trigger Render image deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ghcr.io/experiencequality/xq-svc-exercice:sha-${{ github.sha }}
        run: |
          encoded_image=$(jq -rn --arg image "$IMAGE" '$image | @uri')
          curl --fail --silent --show-error --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&imgURL=${encoded_image}"
